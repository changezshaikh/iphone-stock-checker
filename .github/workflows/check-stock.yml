name: Check iPhone stock

on:
  schedule:
    # Every 5 minutes, offset to :02, :07, :12... because GitHub drops many runs at :00/:05 when busy.
    - cron: "2-59/5 * * * *"
  workflow_dispatch:       # lets you run it by hand from the Actions tab
    inputs:
      test_parts:
        description: "Test alerts: extra in-stock part numbers to check (e.g. MKFT4X/A for AirPods). Leave blank for a normal run."
        required: false
        default: ""

concurrency:
  group: check-stock
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # state.json remembers what was already in stock, so you are only alerted once per store.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
          restore-keys: stock-state-

      - name: Check stock
        env:
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
          POSTCODE: "3042"
          TEST_PARTS: ${{ inputs.test_parts }}
        run: python3 check_stock.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}
